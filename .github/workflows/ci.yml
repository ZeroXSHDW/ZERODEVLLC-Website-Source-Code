name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      # Lint has no committed ESLint config (next lint prompts interactively).
      # Full Jest suite currently has failing UI/WebGL cases; keep CI on type-check.
      - name: Type check
        run: npm run type-check

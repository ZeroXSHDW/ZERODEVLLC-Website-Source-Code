name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      # Lint has no committed ESLint config (next lint prompts interactively).
      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --ci
